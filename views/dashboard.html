<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="icon" type="image/png" href="../img/icons/logo.png">
    <title>Dashboard | EcoMarket</title>
</head>

<body>

    <header class="header">
        <a href="..7index.html" class="logo">
            <img src="../img/icons/logo.png" alt="Logo EcoMarket">
        </a>
        <nav>

            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="sobre-nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="dashboard.html" class="active-link">DASHBOARD</a></li>
            </ul>

        </nav>

        <div class="header-icons">

            <a href="#" class="nav-icon">
                <img src="../img/icons/lupa.svg" alt="Buscar">
            </a>

            <a href="#" class="nav-icon">
                <img src="../img/icons/carrito.svg" alt="Carrito">
            </a>

            <a href="#" class="nav-icon">
                <img src="../img/icons/user.svg" alt="Usuario">
            </a>

        </div>
    </header>
    <main>
        <div class="box-container">

            <article class="box-card">

                <img src="../img/hero/images.png" alt="Cliente">
                <h3 class="name-card">Jane Done</h3>

                <section class="estadisticas-bar">
                    <div class="barras-container">
                        <div class="barras-bar">
                            <legend>Trees Planted</legend>
                            <label for="porcentaje">12/20</label>
                            <input class="range-control" type="range" id="barra" min="12">

                        </div>

                        <div class="barras-bar">
                            <legend>CO<sub>2</sub> Saved</legend>
                            <label for="porcentaje">450 kg</label>
                            <input class="range-control" type="range" id="barra" min="12">

                        </div>

                        <div class="barras-bar">
                            <legend>Water Saved</legend>
                            <label for="porcentaje">2,540 L</label>
                            <input class="range-control" type="range" id="barra" min="12">

                        </div>

                        <div class="barras-bar">
                            <legend>Waste Diverted</legend>
                            <label for="porcentaje">85 kg</label>
                            <input class="range-control" type="range" id="barra" min="12">

                        </div>

                        <div class="barras-bar">
                            <legend>Eco-Points</legend>
                            <label for="porcentaje">1,250</label>
                            <input class="range-control" type="range" id="barra" min="12">

                        </div>

                        <button type="submit" class="btn">View Full Impact Report -></button>

                </section>
            </article>


    </main>
</body>

</html>
