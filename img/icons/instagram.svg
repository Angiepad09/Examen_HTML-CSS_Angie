<svg xmlns="http://www.w3.org/2000/svg"
     width="40"
     height="40"
     viewBox="0 0 48 48">

  <defs>
    <linearGradient id="instagram-gradient"
                    x1="0%" y1="100%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDC80"/>
      <stop offset="35%" stop-color="#F77737"/>
      <stop offset="65%" stop-color="#E1306C"/>
      <stop offset="100%" stop-color="#833AB4"/>
