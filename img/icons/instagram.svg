  <rect x="10" y="10" width="28" height="28"
        rx="8" fill="none" stroke="#FFFFFF"
        stroke-width="3.2"/>

  <circle cx="24" cy="24" r="6.5"
          fill="none" stroke="#FFFFFF"
          stroke-width="3.2"/>

  <circle cx="32.5" cy="15.8" r="2"
          fill="#FFFFFF"/>

